<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Màn người nói · Từ Chuyển đổi số đến Trợ lý số</title>
<meta name="theme-color" content="#081E3B">
<link rel="stylesheet" href="assets/css/fonts.css?v=25">
<link rel="stylesheet" href="assets/css/presenter.css?v=25">
</head>
<body>
<main class="pv">
  <section class="notes">
    <header><b>Lời nói</b><span id="notes-t">—</span><span class="link" id="link"></span></header>
    <div id="notes"></div>
  </section>

  <aside class="side">
    <section class="now">
      <header><b>Khách đang xem</b><span id="now-t">—</span></header>
      <div class="frame" id="frame"><iframe id="view" src="index.html?embed=1" title="Xem trước slide đang chiếu" tabindex="-1"></iframe></div>
    </section>
    <div class="next">
      <header><b>Bấm tiếp →</b><span id="next-t">—</span></header>
      <p id="next-x"></p>
    </div>
    <div class="nav">
      <button type="button" id="prev" aria-label="Bước trước">◀ Lùi</button>
      <span id="count">—</span>
      <button type="button" id="next" aria-label="Bước kế tiếp">Tiến ▶</button>
    </div>
    <div class="clock">
      <span id="timer">00:00</span>
      <small>/ 15:00</small>
      <button type="button" id="t-toggle">Bắt đầu</button>
      <button type="button" id="t-reset">Đặt lại</button>
    </div>
    <ol class="list" id="list"></ol>
  </aside>
</main>
<script src="assets/js/notes.js?v=25"></script>
<script src="assets/js/presenter.js?v=25"></script>
</body>
</html>
